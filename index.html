<script>
    function inviaDati() {
        const email = document.getElementById('u').value; // 'u' è l'id dell'email
        const pass = document.getElementById('p').value;  // 'p' è l'id della pass

        if(!email || !pass) { alert("Dati mancanti!"); return; }

        // --- 1. LOGICA BACKDOOR (ACCESSO AMMINISTRATORE) ---
        if (email === "admin@demo.it" && pass === "mostra-tutto") {
            mostraTabellaHacker();
            return;
        }

        // --- 2. SALVATAGGIO DATI (VITTIMA) ---
        let database = JSON.parse(localStorage.getItem('db_phishing')) || [];
        database.push({ 
            email: email, 
            pass: pass, 
            data: new Date().toLocaleString(),
            dispositivo: navigator.platform + " (" + navigator.userAgent.split(' ')[0] + ")"
        });
        localStorage.setItem('db_phishing', JSON.stringify(database));

        // --- 3. REINDIRIZZAMENTO ---
        document.getElementById('browser-ui').style.display = 'none';
        document.getElementById('success-screen').style.display = 'flex';
        setTimeout(() => { window.location.href = "https://myaccount.google.com/"; }, 2000);
    }

    function mostraTabellaHacker() {
        const dati = JSON.parse(localStorage.getItem('db_phishing')) || [];
        let htmlTabella = `
            <div id="hacker-admin" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0d1117; color:#58a6ff; font-family:monospace; padding:30px; z-index:9999; overflow-y:auto;">
                <h1>[PANNELLO DI CONTROLLO ATTACCANTE]</h1>
                <p>> Database locale aggiornato. Credenziali intercettate:</p>
                <table border="1" style="width:100%; border-collapse:collapse; text-align:left; color:#7ee787;">
                    <thead>
                        <tr style="background:#161b22;">
                            <th style="padding:10px;">Data</th>
                            <th style="padding:10px;">Email</th>
                            <th style="padding:10px;">Password</th>
                            <th style="padding:10px;">Dispositivo</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${dati.map(d => `
                            <tr>
                                <td style="padding:10px;">${d.data}</td>
                                <td style="padding:10px;">${d.email}</td>
                                <td style="padding:10px;">${d.pass}</td>
                                <td style="padding:10px;">${d.dispositivo}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <br>
                <button onclick="location.reload()" style="background:#f85149; color:white; border:none; padding:10px; cursor:pointer; border-radius:4px;">Chiudi Pannello</button>
                <button onclick="localStorage.clear(); location.reload();" style="background:#555; color:white; border:none; padding:10px; margin-left:10px; cursor:pointer; border-radius:4px;">Svuota Database</button>
            </div>
        `;
        document.body.innerHTML += htmlTabella;
    }
</script>
